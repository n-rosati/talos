name: Validate Renovate Flux registryAliases

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml json5

      - name: Validate registry aliases
        run: python .github/scripts/validate-renovate-aliases.py