name: Validate Renovate Flux registryAliases

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Cache pip modules
        id: cache-pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/scripts/validate-renovate-aliases.py') }}
          path: ~/.cache/pip

      - name: Install dependencies
        run: pip install pyyaml json5

      - name: Validate registry aliases
        run: python .github/scripts/validate-renovate-aliases.py