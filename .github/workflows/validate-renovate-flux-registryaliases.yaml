name: Validate Renovate Flux registryAliases

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Cache pip modules
        id: cache-pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/scripts/validate-renovate-aliases.py') }}
          path: ~/.cache/pip

      - name: Install dependencies
        run: pip install pyyaml json5

      - name: Validate registry aliases
        run: python .github/scripts/validate-renovate-aliases.py