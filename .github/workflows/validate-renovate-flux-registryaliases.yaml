name: Validate Renovate Flux registryAliases

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml json5

      - name: Validate registry aliases
        run: python .github/scripts/validate-renovate-aliases.py