name: Validate Renovate Flux registryAliases

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Cache pip modules
        id: cache-pip
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/scripts/validate-renovate-aliases.py') }}
          path: ~/.cache/pip

      - name: Install dependencies
        run: pip install pyyaml json5

      - name: Validate registry aliases
        run: python .github/scripts/validate-renovate-aliases.py