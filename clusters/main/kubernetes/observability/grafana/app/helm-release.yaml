---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  interval: 15m
  chart:
    spec:
      chart: grafana
      version: 25.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME}
                GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
                GF_SERVER_ROOT_URL: https://grafana.${DOMAIN_0}
                GF_PANELS_DISABLE_SANITIZE_HTML: "true"
    # OAuth stuff
    #             GF_AUTH_GENERIC_OAUTH_ENABLED: true
    #             GF_AUTH_GENERIC_OAUTH_NAME: Authelia
    #             GF_AUTH_GENERIC_OAUTH_ICON: signin
    #             GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
    #             GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET}
    #             GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
    #             GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES: false
    #             GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.${DOMAIN_0}/api/oidc/authorization
    #             GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.${DOMAIN_0}/api/oidc/token
    #             GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.${DOMAIN_0}/api/oidc/userinfo
    #             GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
    #             GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
    #             GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
    #             GF_AUTH_GENERIC_OAUTH_USE_PKCE: true
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: grafana.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: le-prod
          nginx:
            enabled: true
            auth:
              type: authelia
              internalHost: ${AUTHELIA_INTERNAL_DNS}
              externalHost: ${AUTHELIA_EXTERNAL_DNS}
          homepage:
            enabled: true
            name: Grafana
            description: Metrics dashboard
            icon: grafana
            group: Observability
            href: https://{{ ( index .Values.ingress.main.hosts 0 ).host }}
            widget:
              custom:
                version: "2"
                username: ${GRAFANA_USERNAME}
                password: ${GRAFANA_PASSWORD}
                fields: '["dashboards", "datasources"]'
    dependencies:
      postgresql:
        operator:
          cluster:
            singleNode: true
            instances: 1