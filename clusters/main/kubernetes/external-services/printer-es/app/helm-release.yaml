apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: printer-es
  namespace: printer-es
spec:
  interval: 2m
  chart:
    spec:
      chart: external-service
      version: 17.10.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    service:
      main:
        type: ExternalIP
        externalIP: ${PRINTER_IP}
        ports:
          main:
            protocol: http
            port: 81
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: print.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: le-prod
          nginx:
            enabled: true
          homepage:
            enabled: true
            name: Printer
            description: " "
            group: Infrastructure
            icon: fluidd.png
