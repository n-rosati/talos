apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freshrss
  namespace: freshrss
spec:
  interval: 2m
  chart:
    spec:
      chart: freshrss
      version: 24.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    alpine:
      repository: alpine
      pullPolicy: IfNotPresent
      tag: "3.22"
    credentials:
      home-s3:
        type: s3
        url: ${S3_URL}
        bucket: freshrss
        encrKey: ${BACKUP_ENCRYPTION_KEY}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: freshrss.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: le-prod
          homepage:
            enabled: true
            name: FreshRSS
            description: RSS feed aggregator
            icon: freshrss
            group: Apps
            href: https://{{ ( index .Values.ingress.main.hosts 0 ).host }}
            widget:
              enabled: false
    persistence:
      config:
        volsync:
          - name: config
            credentials: home-s3
            type: restic
            dest:
              enabled: true
            src:
              enabled: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                INTERNAL_HOST_ALLOWLIST: "172.17.0.0/16 172.16.0.0/16"