apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freshrss
  namespace: freshrss
spec:
  interval: 2m
  chart:
    spec:
      chart: freshrss
      version: 22.7.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    alpine:
      repository: alpine
      pullPolicy: IfNotPresent
      tag: "3.22"
    credentials:
      home-s3:
        name: home-s3
        type: s3
        url: ${S3_URL}
        bucket: freshrss
        encrKey: ${BACKUP_ENCRYPTION_KEY}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: freshrss.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: le-prod
    persistence:
      config:
        volsync:
          - name: config
            credentials: home-s3
            type: restic
            dest:
              enabled: true
            src:
              enabled: true
    workload:
      main:
        podSpec:
          initContainers:
            install-extension-manager:
              enabled: true
              type: init
              imageSelector: alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eux

                  apk add --no-cache git

                  if [ ! -d /config/www/freshrss/extensions/xExtension-ExtensionManager ]; then
                      git clone https://github.com/featurecreep-cron/freshrss-extensions.git /tmp/exts

                      mkdir -p /config/www/freshrss/extensions
                      mv /tmp/exts/xExtension-ExtensionManager /config/www/freshrss/extensions/

                      rm -rf /tmp/exts
                  fi
              additionalVolumeMounts:
                - name: config
                  mountPath: /config
