apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 2m
  timeout: 20m
  chart:
    spec:
      chart: vaultwarden
      version: 32.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      stopAll: false
    credentials:
      home-s3:
        type: s3
        url: ${S3_URL}
        bucket: vaultwarden
        encrKey: ${BACKUP_ENCRYPTION_KEY}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
    service:
      main:
        type: LoadBalancer
        loadBalancerIP: ${VAULTWARDEN_IP}
        integrations:
          metallb:
            enabled: true
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: vaultwarden.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: le-prod
          homepage:
            enabled: true
            name: Vaultwarden
            description: Bitwarden compatible server
            icon: vaultwarden
            group: Apps
            href: https://{{ ( index .Values.ingress.main.hosts 0 ).host }}
            widget:
              enabled: false
    vaultwarden:
      allowSignups: false
      verifySignup: true
      smtp:
        enabled: true
        host: ${SMTP_SERVER}
        from: ${SERVICE_EMAIL}
        fromName: Vaultwarden
        security: force_tls
        port: ${SMTP_PORT}
        authMechanism: Login
        user: ${SERVICE_EMAIL}
        password: ${SERVICE_EMAIL_PASSWORD}
      push:
        enabled: true
        installationId: ${VAULTWARDEN_INST_ID}
        installationKey: ${VAULTWARDEN_INST_KEY}
      log:
        level: "info"
    persistence:
      data:
        volsync:
          - credentials: home-s3
            name: data
            type: restic
            dest:
              enabled: true
            src:
              enabled: true
    dependencies:
      postgresql:
        enabled: true
        depconfig:
        operator:
          mode: recovery
          pgVersion: 16
          backups:
            enabled: true
            revision: "6"
            credentials: home-s3
          recovery:
            revision: "5"
            credentials: home-s3
          monitoring:
            enablePodMonitor: true
          cluster:
            instances: 1
            singleNode: true