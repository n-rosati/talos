apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: ntfy
spec:
  interval: 2m
  chart:
    spec:
      chart: ntfy
      version: 15.0.1
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      stopAll: false
    TZ: America/Toronto
    credentials:
      home-s3:
        type: s3
        url: ${S3_URL}
        bucket: ntfy
        encrKey: ${BACKUP_ENCRYPTION_KEY}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: ntfy.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: le-prod
          nginx:
            enabled: true
          homepage:
            enabled: true
            name: Ntfy
            description: HTTP-based pub-sub notification service
            icon: ntfy
            group: Apps
            href: https://{{ ( index .Values.ingress.main.hosts 0 ).host }}
            widget:
              enabled: true
              type: ntfy
              custom:
                key: ${NTFY_ACCESS_TOKEN}
                url: https://{{ ( index .Values.ingress.main.hosts 0 ).host }}
                topic: notes
                fields: '["lastReceived"]'
    persistence:
      webpush:
        enabled: true
        mountPath: "/var/lib/ntfy"
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                NTFY_BASE_URL: "https://{{ ( index .Values.ingress.main.hosts 0 ).host }}"
                NTFY_BEHIND_PROXY: "true"
                NTFY_DATABASE_URL: '{{ .Values.dependencies.postgresql.depconfig.creds.urlnossl }}'
                NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
                NTFY_ENABLE_LOGIN: "true"
                NTFY_REQUIRE_LOGIN: "true"
                ENABLE_ATTACHMENT_CACHE_DIR: true
                NTFY_CACHE_DURATION: "31d"
                NTFY_ATTACHMENT_FILE_SIZE_LIMIT: "1G"
                NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: "9500M"
                NTFY_ATTACHMENT_EXPIRY_DURATION: "31d"
                NTFY_WEB_PUSH_PUBLIC_KEY: "${NTFY_WEBPUSH_PUBLIC_KEY}"
                NTFY_WEB_PUSH_PRIVATE_KEY: "${NTFY_WEBPUSH_PRIVATE_KEY}"
                NTFY_WEB_PUSH_EMAIL_ADDRESS: "${PERSONAL_EMAIL}"
                NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
                NTFY_AUTH_ACCESS: "*:up*:write-only"
                NTFY_LOG_LEVEL: debug
                NTFY_AUTH_USERS: ${NTFY_USERS}
                NTFY_PROXY_TRUSTED_HOSTS: ${PODNET}
                NTFY_MESSAGE_DELAY_LIMIT: 31d
    metrics:
      main:
        enabled: true
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          postgresqlDatabase: ntfy
          postgresqlUsername: ntfy
          password: ${NTFY_DB_PASSWORD}
        operator:
          mode: recovery
          pgVersion: 16
          backups:
            enabled: true
            revision: "4"
            credentials: home-s3
          recovery:
            revision: "3"
            credentials: home-s3
          monitoring:
            enablePodMonitor: true
          cluster:
            instances: 1
            singleNode: true