apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tt-rss
  namespace: tt-rss
spec:
  interval: 2m
  chart:
    spec:
      chart: tt-rss
      version: 21.7.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    credentials:
      home-s3:
        name: home-s3
        type: s3
        url: ${S3_URL}
        bucket: tt-rss
        encrKey: ${BACKUP_ENCRYPTION_KEY}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: rss.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: le-prod
          nginx:
            enabled: true
            auth:
              type: authelia
              internalHost: ${AUTHELIA_INTERNAL_DNS}
              externalHost: ${AUTHELIA_EXTERNAL_DNS}
    persistence:
      config:
        volsync:
          - name: config
            credentials: home-s3
            type: restic
            dest:
              enabled: true
            src:
              enabled: true
    cnpg:
      main:
        mode: standalone # CHANGE TO RECOVERY ON RESTORE
        cluster:
          singleNode: true
        backups:
          enabled: true
          revision: "1"
          credentials: home-s3
        recovery:
          enabled: true
          revision: "1"
          credentials: home-s3
        monitoring:
          enablePodMonitor: true
