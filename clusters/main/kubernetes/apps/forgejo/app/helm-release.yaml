apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 2m
  timeout: 20m
  chart:
    spec:
      chart: app-template
      version: 21.3.7
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: forgejo
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    release_name: forgejo
    global:
      stopAll: false
    image:
      repository: codeberg.org/forgejo/forgejo
      pullPolicy: IfNotPresent
      tag: 17.0.2-rootless
    credentials:
      home-s3:
        type: s3
        url: ${S3_URL}
        bucket: forgejo
        encrKey: ${BACKUP_ENCRYPTION_KEY}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
    service:
      main:
        enabled: true
        type: LoadBalancer
        ports:
          main:
            enabled: true
            port: 3000
            protocol: http
            targetPort: 3000
          ssh:
            enabled: true
            port: 22
            protocol: tcp
            targetPort: 22
    ingress:
      main:
        enabled: true
        ingressClassName: external
        hosts:
          - host: code.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: le-prod
          nginx:
            enabled: true
          homepage:
            enabled: true
            name: Forgejo
            description: Code repository
            icon: https://codeberg.org/forgejo/forgejo/raw/branch/forgejo/public/assets/img/forgejo.svg
            group: Apps
            href: https://{{ ( index .Values.ingress.main.hosts 0 ).host }}
            widget:
              enabled: false
    persistence:
      forgejo:
        enabled: true
        type: pvc
        mountPath: /etc/gitea
        volsync:
          - name: forgejo
            type: restic
            credentials: home-s3
            dest:
              enabled: true
            src:
              enabled: true
      conf:
        enabled: true
        type: pvc
        mountPath: /var/lib/gitea
        volsync:
          - name: conf
            type: restic
            credentials: home-s3
            dest:
              enabled: true
            src:
              enabled: true
      ssh-key:
        enabled: true
        type: secret
        readOnly: true
        objectName: ssh-secrets
        expandObjectName: false
        mountPath: "/var/lib/ssh-key"
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: true
                  path: "/"
                  port: 3000
                  type: http
                readiness:
                  enabled: true
                  port: 3000
                  type: http
                startup:
                  enabled: false
              env:
                FORGEJO__database__DB_TYPE: postgres
                FORGEJO__database__HOST: "{{ .Values.cnpg.main.creds.host }}"
                FORGEJO__database__NAME: "{{ .Values.cnpg.main.database }}"
                FORGEJO__database__USER: "{{ .Values.cnpg.main.user }}"
                FORGEJO__database__PASSWD: "{{ .Values.cnpg.main.password }}"
                FORGEJO__mailer__ENABLED: "true"
                FORGEJO__mailer__SMTP_ADDR: "${SMTP_SERVER}"
                FORGEJO__mailer__SMTP_PORT: "${SMTP_PORT}"
                FORGEJO__mailer__USER: "${SERVICE_EMAIL}"
                FORGEJO__mailer__PASSWD: "${SERVICE_EMAIL_PASSWORD}"
                FORGEJO__mailer__FROM: "Forgejo <${SERVICE_EMAIL}>"
                FORGEJO__security__PASSWORD_CHECK_PWN: "true"
                FORGEJO__repository.signing__FORMAT: "ssh"
                FORGEJO__repository.signing__SIGNING_KEY: "/var/lib/ssh-key/public.key"
                FORGEJO__security__SECRET_KEY: "${FORGEJO_SECRET_KEY}"
                FORGEJO__repository.signing__DEFAULT_TRUST_MODEL: "committer"
                FORGEJO__openid__ENABLE_OPENID_SIGNIN: false
                FORGEJO__openid__ENABLE_OPENID_SIGNUP: true
                FORGEJO__openid__WHITELISTED_URIS: auth.${DOMAIN_0}
                FORGEJO__server__ROOT_URL: https://code.${DOMAIN_0}
                FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES: "${SVCNET},192.168.2.0/24"
                FORGEJO__server__SSH_DOMAIN: git.${DOMAIN_0}
                FORGEJO__service__ENABLE_INTERNAL_SIGNIN: "true"
                FORGEJO__service__DISABLE_REGISTRATION: "false"
                FORGEJO__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
                FORGEJO__service__SHOW_REGISTRATION_BUTTON: "false"
                FORGEJO__oauth2__USERNAME: userid
                FORGEJO__oauth2__ENABLE_AUTO_REGISTRATION: true
    cnpg:
      main:
        enabled: true
        database: forgejo
        user: forgejo
        password: ${FORGEJO_DB_PASSWORD}
        pgVersion: 16
        mode: standalone # CHANGE TO RECOVERY ON RESTORE
        cluster:
          singleNode: true
          instances: 1
        backups:
          enabled: true
          revision: "2"
          credentials: home-s3
        recovery:
          revision: "1"
          credentials: home-s3
        monitoring:
          enablePodMonitor: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo-runner
    namespace: flux-system
  interval: 30m
  values:
    forgejo:
      url: http://forgejo-app-template.forgejo.svc.cluster.local:3000
      existingSecret: forgejo-runner-secret
    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.2.2"
    plugin:
      image:
        repository: registry.erwanleboucher.dev/eleboucher/runner-k8s-plugin
      # The chart default of 128Mi OOMKills the sidecar under capacity: 3.
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          memory: 512Mi
    podLabels:
      app.kubernetes.io/component: forgejo-runner
    runnerConfig: |
      cache:
        enabled: true
        external_server: http://forgejo-cache.forgejo.svc.cluster.local:4000/
        secret_url: file:/etc/forgejo-runner-secret/cache-secret
        proxy_port: 8089
      container:
        docker_host: "-"
        workdir_parent: shared/workdir
      host:
        workdir_parent: /data/act
      kubernetes:
        namespace: forgejo
        poll_timeout: 10m
      log:
        level: info
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: forgejo
            poll_timeout: 10m
            labels: "app.kubernetes.io/name=forgejo-runner-instance,egress.home.arpa/custom-egress=true"
            resources: |
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      runner:
        capacity: 3
        labels:
          - ubuntu-latest:k8s:///config/podspec-default.yaml
          - default:k8s:///config/podspec-default.yaml
          - docker:k8s:///config/podspec-dind.yaml
          - multiarch:k8s:///config/podspec-dind.yaml  # you need binfmt-misc extension for multiarch
          - heavy:k8s:///config/podspec-heavy.yaml  # long compiles (webkitgtk); see podspec-heavy
        # Ceiling for every job, not a target. webkitgtk needs ~1.5-4h and the
        # previous 3h cut it too fine; ordinary jobs are unaffected.
        timeout: 8h
        shutdown_timeout: 3m
    podSpecs:
      podspec-default.yaml: |
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-26.04@sha256:9e5ac2bb10fc669dddf994d8cf5388eeaa8cbf15d220cf020c5281a7060c4d7b
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 4Gi
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - kharkiv
        restartPolicy: Never
      podspec-heavy.yaml: |
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-26.04@sha256:9e5ac2bb10fc669dddf994d8cf5388eeaa8cbf15d220cf020c5281a7060c4d7b
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              # Burstable on purpose: at 36Gi request=limit this held
              # oom_score_adj -997 and the kernel killed postgres instead of it.
              requests:
                cpu: "4"
                memory: 8Gi
                ephemeral-storage: 40Gi
              limits:
                cpu: "12"
                memory: 24Gi
                ephemeral-storage: 60Gi
            volumeMounts:
              # $BUILDDIR: the plugin's own "shared" workdir is capped at 10Gi.
              - name: build
                mountPath: /build
        volumes:
          - name: build
            emptyDir:
              sizeLimit: 40Gi
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - kharkiv
        restartPolicy: Never
      podspec-dind.yaml: |
        initContainers:
          - name: dind
            image: docker:29-dind
            # Keep Buildx cgroups inside the DinD memory limit.
            command: [sh, -ec]
            args:
              - |
                apk add --no-cache util-linux-misc
                exec unshare --cgroup --mount sh -ec '
                  mount --make-rprivate /
                  umount /sys/fs/cgroup
                  mount -t cgroup2 none /sys/fs/cgroup
                  exec dockerd-entrypoint.sh "$@"
                ' dind "$@"
              - dind
              - --ipv6
              - --fixed-cidr-v6=fd00:d1d::/64
            securityContext:
              privileged: true
            restartPolicy: Always
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            resources:
              requests:
                cpu: 100m
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 12Gi
            volumeMounts:
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: docker-certs
                mountPath: /certs
              - name: shared
                mountPath: /shared
            startupProbe:
              exec:
                command:
                  - sh
                  - -c
                  - docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem --tlskey=/certs/client/key.pem -H tcp://localhost:2376 info
              initialDelaySeconds: 5
              periodSeconds: 1
              failureThreshold: 30
        containers:
          - env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_TLS_VERIFY
                value: "1"
              - name: DOCKER_CERT_PATH
                value: /certs/client
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-26.04@sha256:9e5ac2bb10fc669dddf994d8cf5388eeaa8cbf15d220cf020c5281a7060c4d7b
            imagePullPolicy: IfNotPresent
            name: main
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 4Gi
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
                readOnly: true
        volumes:
          - name: docker-storage
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values:
                        - kharkiv
        restartPolicy: Never
