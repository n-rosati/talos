apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lldap
  namespace: lldap
spec:
  interval: 2m
  timeout: 20m
  chart:
    spec:
      chart: lldap
      version: 11.0.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      stopAll: false
    credentials:
      home-s3:
        type: s3
        url: ${S3_URL}
        bucket: lldap
        encrKey: ${BACKUP_ENCRYPTION_KEY}
        accessKey: ${S3_ACCESS_KEY}
        secretKey: ${S3_SECRET_KEY}
    service:
      ldap:
        type: LoadBalancer
        loadBalancerIP: ${LLDAP_IP}
        integrations:
          metallb:
            enabled: true
    ingress:
      main:
        enabled: true
        ingressClassName: internal
        hosts:
          - host: lldap.${DOMAIN_0}
        integrations:
          certManager:
            enabled: true
            certificateIssuer: le-prod
          nginx:
            enabled: true
            auth:
              type: authelia
              internalHost: ${AUTHELIA_INTERNAL_DNS}
              externalHost: ${AUTHELIA_EXTERNAL_DNS}
          homepage:
            enabled: true
            name: LLDAP
            description: Lightweight LDAP server
            icon: lldap
            group: Infrastructure
            href: https://{{ ( index .Values.ingress.main.hosts 0 ).host }}
            widget:
              enabled: false
    persistence:
      data:
        volsync:
          - credentials: home-s3
            name: data
            type: restic
            dest:
              enabled: true
            src:
              enabled: true
    dependencies:
      postgresql:
        enabled: true
        depconfig:
          password: ${CNPG_PASSWORD}
        operator:
          mode: recovery
          backups:
            enabled: true
            revision: "6"
            credentials: home-s3
          recovery:
            revision: "5"
            credentials: home-s3
          monitoring:
            enablePodMonitor: true
          cluster:
            instances: 1
            singleNode: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                LLDAP_HTTP_URL: https://lldap.${DOMAIN_0}
                LLDAP_LDAP_BASE_DN: ${LDAP_BASE_DN}
                # Admin user
                LLDAP_LDAP_USER_DN: ${LDAP_USER_DN}
                LLDAP_LDAP_USER_EMAIL: ${PERSONAL_EMAIL}
                LLDAP_LDAP_USER_PASS: ${LDAP_USER_PASS}
                # Email
                LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET: true
                LLDAP_SMTP_OPTIONS__SERVER: ${SMTP_SERVER}
                LLDAP_SMTP_OPTIONS__PORT: ${SMTP_PORT}
                LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION: TLS
                LLDAP_SMTP_OPTIONS__USER: ${SERVICE_EMAIL}
                LLDAP_SMTP_OPTIONS__PASSWORD: ${SERVICE_EMAIL_PASSWORD}
                LLDAP_SMTP_OPTIONS__FROM: "LLDAP <${SERVICE_EMAIL}>"
                LLDAP_SMTP_OPTIONS__REPLY_TO: ${SERVICE_EMAIL}
